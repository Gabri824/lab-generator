name: Build & Release Executables

on:
  push:
    tags:
      - 'v*' # Si attiva quando crei un tag di versione (es. git tag v1.0.0 && git push --tags)
  workflow_dispatch: # Permette anche di avviarlo a mano da GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04 # Versione precedente per garantire retrocompatibilità glibc
            artifact_name: labGenerator-linux.tar.gz
            output_name: labGenerator
          - os: windows-latest
            artifact_name: labGenerator-windows.exe
            output_name: labGenerator.exe

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Installa eventuali librerie grafiche o moduli (es. customtkinter, kathara, ecc.)
          # pip install -r requirements.txt

      - name: Compilazione con PyInstaller (Onefile)
        run: |
          pyinstaller --onefile --name ${{ matrix.output_name }} src/labGenerator.py

      - name: Comprimi con permessi (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          chmod +x ${{ matrix.output_name }}
          tar -czvf ${{ matrix.artifact_name }} ${{ matrix.output_name }}

      - name: Rinomina per il caricamento (Windows)
        if: runner.os == 'Windows'
        run: copy dist\${{ matrix.output_name }} dist\${{ matrix.artifact_name }}

      - name: Carica artefatto temporaneo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per creare la release
    steps:
      - name: Scarica tutti i binari compilati
        uses: actions/download-artifact@v4
        with:
          path: binari/

      - name: Pubblica Release con i binari allegati
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binari/labGenerator-linux.tar.gz/labGenerator-linux.tar.gz
            binari/labGenerator-windows.exe/labGenerator-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
