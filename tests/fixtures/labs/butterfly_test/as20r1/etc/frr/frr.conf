password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 20

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 20.30.0.0/24
    network 20.50.0.0/24
    network 10.20.0.0/24
    neighbor 10.20.0.10 remote-as 10
    neighbor 10.20.0.10 description Router as10r1
    neighbor 20.30.0.30 remote-as 30
    neighbor 20.30.0.30 description Router as30r1
    neighbor 20.50.0.50 remote-as 50
    neighbor 20.50.0.50 description Router as50r1
    neighbor 20.50.0.50 route-map PREF_IN_20_50_0_50 in
    neighbor 20.30.0.30 route-map PREF_IN_20_30_0_30 in

route-map PREF_IN_20_50_0_50 permit 10
    match ip address prefix-list PREF_IN_20_50_0_50_NETS
    set local-preference 150
route-map PREF_IN_20_50_0_50 permit 20

ip prefix-list PREF_IN_20_50_0_50_NETS permit 100.1.0.0/24

route-map PREF_IN_20_30_0_30 permit 10
    match ip address prefix-list PREF_IN_20_30_0_30_NETS
    set local-preference 150
route-map PREF_IN_20_30_0_30 permit 20

ip prefix-list PREF_IN_20_30_0_30_NETS permit 100.2.0.0/24
