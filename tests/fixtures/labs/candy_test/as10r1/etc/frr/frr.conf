password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 10

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 192.168.0.0/30
    network 110.0.0.0/24

    neighbor 192.168.0.2 remote-as 40
    neighbor 192.168.0.2 description Router as40r1

    neighbor 192.168.0.2 prefix-list PL_as10r1_192_168_0_2_in in
ip prefix-list PL_as10r1_192_168_0_2_in deny 160.0.0.0/24
ip prefix-list PL_as10r1_192_168_0_2_in permit any

