password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 30

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 192.168.0.12/30
    network 130.0.0.0/24

    neighbor 192.168.0.14 remote-as 50
    neighbor 192.168.0.14 description Router as50r1

    neighbor 192.168.0.14 prefix-list PL_as30r1_192_168_0_14_in in
ip prefix-list PL_as30r1_192_168_0_14_in deny 180.0.0.0/24
ip prefix-list PL_as30r1_192_168_0_14_in permit any

