password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 80

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 192.168.0.28/30
    network 180.0.0.0/24

    neighbor 192.168.0.30 remote-as 40
    neighbor 192.168.0.30 description Router as40r1

    neighbor 192.168.0.30 prefix-list PL_as80r1_192_168_0_30_in in
ip prefix-list PL_as80r1_192_168_0_30_in deny 130.0.0.0/24
ip prefix-list PL_as80r1_192_168_0_30_in permit any

