password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 300

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 200.150.1.0/30
    network 200.150.2.0/30
    neighbor 200.150.1.1 remote-as 200
    neighbor 200.150.1.1 description Router as200r3
    neighbor 200.150.2.1 remote-as 200
    neighbor 200.150.2.1 description Router as200r4
    neighbor 200.150.2.1 route-map PREF_IN_200_150_2_1 in
    network 150.0.0.0/8

route-map PREF_IN_200_150_2_1 permit 10
    set local-preference 150
