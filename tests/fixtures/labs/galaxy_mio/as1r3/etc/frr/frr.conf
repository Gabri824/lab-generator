password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router rip

    network 1.0.0.0/8

    redistribute connected
    redistribute bgp

router bgp 1

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 10.20.0.0/30
    network 20.10.0.0/30
    neighbor 10.20.0.2 remote-as 2
    neighbor 10.20.0.2 description Router as2r1
    neighbor 20.10.0.2 remote-as 2
    neighbor 20.10.0.2 description Router as2r5
    neighbor 10.20.0.2 default-originate
    neighbor 10.20.0.2 prefix-list SOLO_DEFAULT_10_20_0_2 out
    neighbor 20.10.0.2 default-originate
    neighbor 20.10.0.2 prefix-list SOLO_DEFAULT_20_10_0_2 out
    network 1.0.0.0/8
    neighbor 20.10.0.2 prefix-list PL_as1r3_20_10_0_2_in in

ip prefix-list SOLO_DEFAULT_10_20_0_2 permit 0.0.0.0/0
ip prefix-list SOLO_DEFAULT_10_20_0_2 permit 1.0.0.0/8

ip prefix-list SOLO_DEFAULT_20_10_0_2 permit 0.0.0.0/0
ip prefix-list SOLO_DEFAULT_20_10_0_2 permit 1.0.0.0/8

ip prefix-list PL_as1r3_20_10_0_2_in deny 2.4.0.0/24
ip prefix-list PL_as1r3_20_10_0_2_in permit any
