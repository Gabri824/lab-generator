password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router ospf

    network 2.0.0.0/8 area 0.0.0.0

    redistribute connected
    redistribute bgp

router bgp 2

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 20.10.0.0/30
    neighbor 20.10.0.1 remote-as 1
    neighbor 20.10.0.1 description Router as1r3
    network 2.0.0.0/8
    network 2.1.0.0/24
    network 2.2.0.0/24
    network 2.3.0.0/24
    network 2.4.0.0/24
    network 2.5.0.0/24
    network 2.6.0.0/24
    network 2.7.0.0/24
    neighbor 20.10.0.1 route-map LOCALMED_OUT_20_10_0_1 out

route-map LOCALMED_OUT_20_10_0_1 permit 10
    set metric 20
