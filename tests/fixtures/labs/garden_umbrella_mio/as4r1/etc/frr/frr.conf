password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 4

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 4.6.0.0/24
    network 3.4.0.0/24
    network 4.5.0.0/24
    neighbor 3.4.0.3 remote-as 3
    neighbor 3.4.0.3 description Router as3r1
    neighbor 4.6.0.6 remote-as 6
    neighbor 4.6.0.6 description Router as6r1
    neighbor 4.5.0.5 remote-as 5
    neighbor 4.5.0.5 description Router as5r1
    neighbor 4.5.0.5 route-map PREF_IN_4_5_0_5 in
    neighbor 4.6.0.6 route-map PREF_IN_4_6_0_6 in

route-map PREF_IN_4_5_0_5 permit 10
    match ip address prefix-list PREF_IN_4_5_0_5_NETS
    set local-preference 150
route-map PREF_IN_4_5_0_5 permit 20

ip prefix-list PREF_IN_4_5_0_5_NETS permit 6.1.0.0/24

route-map PREF_IN_4_6_0_6 permit 10
    match ip address prefix-list PREF_IN_4_6_0_6_NETS
    set local-preference 150
route-map PREF_IN_4_6_0_6 permit 20

ip prefix-list PREF_IN_4_6_0_6_NETS permit 6.2.0.0/24
