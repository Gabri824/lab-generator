password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 5

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 5.6.0.0/24
    network 4.5.0.0/24
    network 3.5.0.0/24
    neighbor 3.5.0.3 remote-as 3
    neighbor 3.5.0.3 description Router as3r1
    neighbor 4.5.0.4 remote-as 4
    neighbor 4.5.0.4 description Router as4r1
    neighbor 5.6.0.6 remote-as 6
    neighbor 5.6.0.6 description Router as6r1
    neighbor 4.5.0.4 route-map PREF_IN_4_5_0_4 in
    neighbor 5.6.0.6 route-map PREF_IN_5_6_0_6 in

route-map PREF_IN_4_5_0_4 permit 10
    match ip address prefix-list PREF_IN_4_5_0_4_NETS
    set local-preference 150
route-map PREF_IN_4_5_0_4 permit 20

ip prefix-list PREF_IN_4_5_0_4_NETS permit 6.2.0.0/24

route-map PREF_IN_5_6_0_6 permit 10
    match ip address prefix-list PREF_IN_5_6_0_6_NETS
    set local-preference 150
route-map PREF_IN_5_6_0_6 permit 20

ip prefix-list PREF_IN_5_6_0_6_NETS permit 6.1.0.0/24
