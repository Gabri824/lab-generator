password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 300

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 1.0.0.4/30
    network 1.0.0.16/30
    network 1.0.0.28/30
    network 1.0.0.12/30
    network 1.0.0.8/30
    neighbor 1.0.0.9 remote-as 100
    neighbor 1.0.0.9 description Router as100r1
    neighbor 1.0.0.5 remote-as 200
    neighbor 1.0.0.5 description Router as200r1
    neighbor 1.0.0.18 remote-as 500
    neighbor 1.0.0.18 description Router as500r1
    neighbor 1.0.0.30 remote-as 10
    neighbor 1.0.0.30 description Router as10r3
    neighbor 1.0.0.14 remote-as 400
    neighbor 1.0.0.14 description Router as400r1
    neighbor 1.0.0.14 route-map PREF_IN_1_0_0_14 in
    neighbor 1.0.0.18 route-map PREF_IN_1_0_0_18 in

route-map PREF_IN_1_0_0_14 permit 10
    match ip address prefix-list PREF_IN_1_0_0_14_NETS
    set local-preference 150
route-map PREF_IN_1_0_0_14 permit 20

ip prefix-list PREF_IN_1_0_0_14_NETS permit 10.1.0.0/24

route-map PREF_IN_1_0_0_18 permit 10
    match ip address prefix-list PREF_IN_1_0_0_18_NETS
    set local-preference 150
route-map PREF_IN_1_0_0_18 permit 20

ip prefix-list PREF_IN_1_0_0_18_NETS permit 10.2.0.0/24
