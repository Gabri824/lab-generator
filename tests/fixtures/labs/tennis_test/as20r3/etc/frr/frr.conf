password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router ospf

    network 20.0.0.0/8 area 0.0.0.0

    redistribute connected
    redistribute bgp
    auto-cost reference-bandwidth 100

router bgp 20

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 10.20.0.0/30
    neighbor 20.2.0.2 remote-as 20
    neighbor 20.2.0.2 description Router as20r2
    neighbor 20.3.0.4 remote-as 20
    neighbor 20.3.0.4 description Router as20r4
    neighbor 10.20.0.1 remote-as 10
    neighbor 10.20.0.1 description Router as10r1
    network 20.0.0.0/8
    neighbor 20.1.0.1 remote-as 20
    neighbor 20.1.0.1 description iBGP as20r1

interface eth1
    ospf cost 90

