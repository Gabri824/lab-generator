password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router rip

    network 2.0.0.0/8

    redistribute connected
    redistribute bgp

router bgp 2

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 2.20.0.0/30
    neighbor 2.20.0.1 remote-as 20
    neighbor 2.20.0.1 description Router as20r1
    network 2.0.0.0/8
    neighbor 2.1.0.1 remote-as 2
    neighbor 2.1.0.1 description iBGP as2r1
    neighbor 2.20.0.1 route-map PREF_IN_2_20_0_1 in
    neighbor 2.20.0.1 route-map LOCALMED_OUT_2_20_0_1 out

route-map PREF_IN_2_20_0_1 permit 10
    set local-preference 150

route-map LOCALMED_OUT_2_20_0_1 permit 10
    set metric 20
