password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 1

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 10.0.0.0/24
    network 20.0.0.0/24
    neighbor 10.0.0.2 remote-as 2
    neighbor 10.0.0.2 description Router r2
    neighbor 20.0.0.2 remote-as 3
    neighbor 20.0.0.2 description Router r3
    
    neighbor 10.0.0.2 prefix-list peer_r2_in in
    neighbor 10.0.0.2 prefix-list peer_r2_out out


ip prefix-list peer_r2_in permit any
ip prefix-list peer_r2_out permit 20.0.0.1
ip prefix-list peer_r2_out permit 20.0.0.2

