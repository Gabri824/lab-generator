password zebra
enable password zebra

log file /var/log/frr/frr.log

debug bgp keepalives
debug bgp updates in
debug bgp updates out

router bgp 4

    no bgp ebgp-requires-policy
    no bgp network import-check

    network 30.0.0.0/24
    neighbor 30.0.0.1 remote-as 2
    neighbor 30.0.0.1 description Router r2
    
    neighbor 30.0.0.1 prefix-list provider_r2_in in
    neighbor 30.0.0.1 prefix-list provider_r2_out out


ip prefix-list provider_r2_in permit any
ip prefix-list provider_r2_out permit 30.0.0.2

